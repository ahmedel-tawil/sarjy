# Runs the test suites and the frontend build. The generated standards.yml lints and
# type-checks but does not run tests, and setup regenerates it, so tests live here.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A real Postgres for the database tests (O-20), the same major version as Cloud SQL.
    # The password only guards this throwaway container.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sarjy
          POSTGRES_PASSWORD: sarjy
          POSTGRES_DB: sarjy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sarjy -d sarjy_test"
          --health-interval 2s
          --health-retries 15
    env:
      SARJY_TEST_DATABASE_URL: postgresql://sarjy:sarjy@localhost:5432/sarjy_test
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run build
