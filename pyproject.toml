[project]
name = "sarjy"
version = "0.1.0"
description = "Workspace root for Sarjy's Python services; holds shared dev tooling only."
requires-python = ">=3.14"
# The services are workspace members, not dependencies: `uv sync --all-packages`
# installs both for local work, as CI does.
dependencies = []

[tool.uv]
# The root only groups the services; it is never built or installed itself.
package = false

[tool.uv.workspace]
members = ["gateway", "tts"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["gateway/tests", "tts/tests"]
# Both services have a tests/ folder; importlib mode lets test files share names.
addopts = ["--import-mode=importlib"]
# Lets tests import shared helpers by their path, such as gateway.tests.fakes.
pythonpath = ["."]

[tool.ruff]
extend = ".ruff-strict.toml"
